<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuy Talk Admin</title>
<style>body{font-family:Prompt,system-ui,sans-serif;background:#0f0c18;color:#eee;margin:0;padding:20px}h1{color:#fbbf24}table{width:100%;border-collapse:collapse;margin-bottom:28px;font-size:14px}td,th{padding:8px;border-bottom:1px solid #2a2440;text-align:left;vertical-align:top}
button{border:0;border-radius:8px;padding:6px 10px;cursor:pointer;font-family:inherit;margin:2px}.ban{background:#ef4444;color:#fff}.ok{background:#22c55e;color:#fff}.g{background:#333;color:#fff}.st{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}.st div{background:#1c1730;padding:12px 18px;border-radius:12px}.pending{color:#fbbf24}.resolved{color:#22c55e}.dismissed{color:#888}</style></head>
<body><h1>🛡️ Kuy Talk Admin</h1><div class=st id=st></div><h2>✔ คำขอยืนยันตัวตน</h2><div id=vf></div><h2>รายงาน</h2><table id=rp></table><h2>🎧 เรื่องจากฝ่ายบริการลูกค้า</h2><table id=tk></table><h2>📨 คำขอเจ้าของข้อมูล (PDPA, ครบกำหนด 30 วัน)</h2><table id=dr></table><h2>ผู้ใช้</h2><table id=us></table>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const post=(u,b)=>fetch('/api/admin/'+u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(load);
async function load(){const d=await (await fetch('/api/admin/overview')).json();
st.innerHTML=Object.entries({ผู้ใช้:d.stats.users,ออนไลน์:d.stats.online,แมตช์:d.stats.matches,โมเมนต์:d.stats.moments,รายงานรอตรวจ:d.stats.pending}).map(([k,v])=>`<div>${k}<br><b style="font-size:22px">${v}</b></div>`).join('');
rp.innerHTML='<tr><th>เวลา</th><th>ผู้รายงาน → ผู้ถูกรายงาน</th><th>หมวด/ระดับ</th><th>รายละเอียด</th><th>สถานะ</th><th></th></tr>'+(d.reports.map(r=>`<tr><td>${new Date(r.ts).toLocaleString('th-TH')}</td><td>${esc(r.byName)} → <b>${esc(r.targetName)}</b></td><td>${esc(r.category)} / ${esc(r.severity)}<br><small>${esc(r.context)}</small></td><td>${esc(r.detail)}</td><td class=${r.status}>${r.status}</td><td><button class=ok onclick="post('report',{id:'${r.id}',status:'resolved'})">แก้แล้ว</button><button class=g onclick="post('report',{id:'${r.id}',status:'dismissed'})">ยกเลิก</button><button class=ban onclick="post('ban',{id:'${r.target}',banned:true})">แบน</button></td></tr>`).join('')||'<tr><td colspan=6>ยังไม่มีรายงาน</td></tr>');
us.innerHTML='<tr><th>ชื่อ</th><th>อายุ</th><th>เหรียญ</th><th>Premium</th><th>ถูกรายงาน</th><th>สถานะ</th><th></th></tr>'+d.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${u.age}</td><td>${u.coins}</td><td>${u.premium?'👑':''}</td><td>${u.reportsAgainst}</td><td>${u.banned?'🚫 ระงับ':u.online?'🟢 ออนไลน์':'⚪'}</td><td>${u.banned?`<button class=ok onclick="post('ban',{id:'${u.id}',banned:false})">ปลดแบน</button>`:`<button class=ban onclick="post('ban',{id:'${u.id}',banned:true})">แบน</button>`}</td></tr>`).join('')}
const _l=load;load=async function(){await _l();const d=await (await fetch('/api/admin/overview')).json();vf.innerHTML=d.verifies.length?d.verifies.map(v=>`<div style="display:inline-block;margin:6px;padding:8px;border:1px solid #444;border-radius:10px;text-align:center"><img src="${/^data:image\//.test(v.photo||'')?v.photo:''}" style="width:140px;height:180px;object-fit:cover;border-radius:8px"><br>${esc(v.name)}<br>${/^data:image\//.test(v.avatar||'')?`<img src="${v.avatar}" style="width:40px;height:40px;border-radius:50%;object-fit:cover">`:esc(v.avatar)}<br><button class=ok onclick="post('verify',{id:'${esc(v.id)}',approve:true})">อนุมัติ</button> <button class=ban onclick="post('verify',{id:'${esc(v.id)}',approve:false})">ปฏิเสธ</button></div>`).join(''):'<p>ไม่มีคำขอ</p>'};
const _l2=load;load=async function(){await _l2();const d=await (await fetch('/api/admin/overview')).json();
const act=(t)=>`<button class=ok onclick="tkReply('${t.id}','resolved')">ตอบ+ปิด</button> <button onclick="post('ticket',{id:'${t.id}',status:'rejected'})">ปฏิเสธ</button>`;
tk.innerHTML='<tr><th>เวลา</th><th>ผู้ใช้</th><th>หัวข้อ</th><th>ข้อความ</th><th>สถานะ</th><th></th></tr>'+(d.tickets||[]).map(t=>`<tr><td>${new Date(t.ts).toLocaleString('th-TH')}</td><td>${esc(t.name)}<br><small>${esc(t.email||'')}</small></td><td>${esc(t.topicLabel)}</td><td>${esc(t.message)}${t.reply?'<br><small>↳ '+esc(t.reply)+'</small>':''}</td><td class=${esc(t.status)}>${esc(t.status)}</td><td>${act(t)}</td></tr>`).join('');
dr.innerHTML='<tr><th>เวลา</th><th>ผู้ใช้</th><th>ประเภท</th><th>รายละเอียด</th><th>ครบกำหนด</th><th>สถานะ</th><th></th></tr>'+(d.dataRequests||[]).map(t=>`<tr><td>${new Date(t.ts).toLocaleString('th-TH')}</td><td>${esc(t.name)}</td><td>${esc(t.label)}</td><td>${esc(t.detail)}</td><td>${new Date(t.due).toLocaleDateString('th-TH')}</td><td class=${esc(t.status)}>${esc(t.status)}</td><td><button class=ok onclick="tkReply('${t.id}','done')">ดำเนินการแล้ว</button> <button onclick="tkReply('${t.id}','rejected')">ปฏิเสธ</button></td></tr>`).join('');
st.insertAdjacentHTML('beforeend',`<div>เรื่องลูกค้า<br><b style="font-size:22px">${(d.tickets||[]).filter(t=>t.status==='open').length}</b></div><div>คำขอ PDPA<br><b style="font-size:22px">${(d.dataRequests||[]).filter(t=>t.status==='pending').length}</b></div><div>ที่เก็บข้อมูล<br><b>${esc(d.storage||'')}</b></div><div>SMS<br><b>${esc(d.sms||'')}</b></div>`)};
window.tkReply=(id,status)=>{const r=prompt('ข้อความตอบกลับผู้ใช้ (ส่งในแชท Kuy Talk Team)','');if(r===null)return;post('ticket',{id,status,reply:r||undefined})};
load();setInterval(load,10000);
</script></body></html>
