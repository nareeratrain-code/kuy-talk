services:
  - type: web
    name: kuy-talk
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL        # Set this in Render Dashboard to a Render Postgres internal URL or Neon URL.
        sync: false
      - key: REQUIRE_PERSISTENT_DB
        value: "true"           # Fail startup instead of silently using ephemeral data.json.
      - key: OTP_SECRET
        generateValue: true
      - key: SMS_PROVIDER        # thaibulksms | twilio | console (console = on-screen test codes)
        value: console
      # thaibulksms: THAIBULKSMS_API_KEY, THAIBULKSMS_API_SECRET, THAIBULKSMS_SENDER (approved sender name)
      # twilio:      TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM (or TWILIO_MESSAGING_SERVICE_SID)
      - key: FIREBASE_WEB_CONFIG       # one-line JSON {"apiKey","authDomain","projectId","appId","messagingSenderId"} -> enables Firebase Phone Auth
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT  # service-account key JSON (raw or base64)
        sync: false
      # - key: STORAGE                 # firestore | postgres-by-DATABASE_URL | json
      #   value: firestore
      # - key: FIREBASE_APPCHECK_SITE_KEY  # optional reCAPTCHA v3 site key for App Check
      # - key: DATA_DIR        # set to the disk mount path if you attach a disk (paid plan)
      #   value: /var/data
    # disk:                    # paid plans only – persistent data
    #   name: kuy-talk-data
    #   mountPath: /var/data
    #   sizeGB: 1
